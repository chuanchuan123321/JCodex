<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minibot</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <span class="logo-icon">M</span>
                    <span class="logo-text">Minibot</span>
                </div>
            </div>
            
            <div class="sidebar-content">
                <div class="section-title">Workspace</div>
                <div class="workspace-section">
                    <div class="workspace-folder" id="outputFolder">
                        <div class="folder-header">
                            <svg class="folder-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                            </svg>
                            <span>output</span>
                            <button class="btn-refresh" onclick="refreshWorkspace('output')" title="Refresh">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M23 4v6h-6M1 20v-6h6"/>
                                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                                </svg>
                            </button>
                        </div>
                        <div class="file-list" id="outputFiles"></div>
                    </div>
                    <div class="workspace-folder" id="tempFolder">
                        <div class="folder-header">
                            <svg class="folder-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                            </svg>
                            <span>temp</span>
                            <button class="btn-refresh" onclick="refreshWorkspace('temp')" title="Refresh">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M23 4v6h-6M1 20v-6h6"/>
                                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                                </svg>
                            </button>
                        </div>
                        <div class="file-list" id="tempFiles"></div>
                    </div>
                </div>
                
                <div class="section-title" style="margin-top: 16px;">Memory</div>
                <div class="workspace-section">
                    <div class="workspace-folder" id="memoryFolder">
                        <div class="folder-header">
                            <svg class="folder-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                            </svg>
                            <span>Memory</span>
                            <button class="btn-refresh" onclick="event.stopPropagation(); refreshMemory()" title="Refresh">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M23 4v6h-6M1 20v-6h6"/>
                                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                                </svg>
                            </button>
                        </div>
                        <div class="file-list" id="memoryFiles">
                            <div class="file-item" onclick="openMemoryFile('execution_history')">
                                <svg class="file-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                                    <polyline points="14 2 14 8 20 8"/>
                                    <line x1="16" y1="13" x2="8" y2="13"/>
                                    <line x1="16" y1="17" x2="8" y2="17"/>
                                </svg>
                                <span class="file-name">execution_history.md</span>
                            </div>
                            <div class="file-item" onclick="openMemoryFile('accumulated_compression')">
                                <svg class="file-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                                    <polyline points="14 2 14 8 20 8"/>
                                    <line x1="16" y1="13" x2="8" y2="13"/>
                                    <line x1="16" y1="17" x2="8" y2="17"/>
                                </svg>
                                <span class="file-name">accumulated_compression.md</span>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="section-title" style="margin-top: 16px;">Skills</div>
                <div class="workspace-section">
                    <div class="workspace-folder" id="skillsFolder">
                        <div class="folder-header">
                            <svg class="folder-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                            </svg>
                            <span>Skills</span>
                            <button class="btn-refresh" onclick="refreshSkills()" title="Refresh">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M23 4v6h-6M1 20v-6h6"/>
                                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                                </svg>
                            </button>
                        </div>
                        <div class="file-list" id="skillsList"></div>
                        <button class="btn-add-skill" onclick="addSkill()">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 5v14M5 12h14"/>
                            </svg>
                            Add Skill Folder
                        </button>
                    </div>
                </div>
            </div>
            
            <div class="sidebar-footer">
                <button class="btn-settings" id="settingsBtn" title="Settings">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                    </svg>
                    <span>Settings</span>
                </button>
                <div class="status-indicator" id="statusIndicator">
                    <span class="status-dot"></span>
                    <span class="status-text">Ready</span>
                </div>
            </div>
        </aside>
        
        <main class="main-content">
            <header class="chat-header">
                <div class="header-left">
                    <h1 class="chat-title">Chat</h1>
                </div>
                <div class="header-right">
                    <div class="token-indicator" id="tokenIndicator" title="Memory Token Usage">
                        <div class="token-progress">
                            <div class="token-progress-bar" id="tokenProgressBar"></div>
                        </div>
                        <span class="token-text" id="tokenText">0/30k</span>
                    </div>
                    <button class="btn-icon" id="clearChat" title="Clear">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
                        </svg>
                    </button>
                </div>
            </header>
            
            <div class="chat-messages" id="chatMessages">
                <div class="welcome-message">
                    <div class="welcome-icon">M</div>
                    <h2>Welcome to Minibot</h2>
                    <p>Your AI automation assistant</p>
                    <div class="quick-actions">
                        <button class="quick-action" data-prompt="Help me write a Python script">Write Code</button>
                        <button class="quick-action" data-prompt="Search for latest AI news">Web Search</button>
                        <button class="quick-action" data-prompt="Create a new file">Create File</button>
                    </div>
                </div>
            </div>
            
            <div class="input-area">
                <div class="input-container">
                    <textarea 
                        id="messageInput" 
                        placeholder="Message Minibot..." 
                        rows="1"
                        autocomplete="off"
                    ></textarea>
                    <button class="btn-send" id="sendButton" disabled>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </main>
    </div>
    
    <div class="file-modal" id="fileModal">
        <div class="file-modal-content">
            <div class="file-modal-header">
                <span class="file-modal-title" id="fileModalTitle">file.txt</span>
                <button class="btn-icon" onclick="closeFileModal()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6L6 18M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <div class="file-modal-body">
                <pre class="file-content" id="fileContent"></pre>
            </div>
        </div>
    </div>
    
    <div class="settings-modal" id="settingsModal">
        <div class="settings-modal-content">
            <div class="settings-modal-header">
                <span>Settings</span>
                <button class="btn-icon" onclick="closeSettingsModal()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6L6 18M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <div class="settings-modal-body">
                <div class="settings-group">
                    <label class="settings-label">API Base URL</label>
                    <input type="text" class="settings-input" id="settingApiBaseUrl" placeholder="https://api.openai.com/v1">
                </div>
                <div class="settings-group">
                    <label class="settings-label">API Key</label>
                    <input type="password" class="settings-input" id="settingApiKey" placeholder="sk-...">
                </div>
                <div class="settings-group">
                    <label class="settings-label">API Model</label>
                    <input type="text" class="settings-input" id="settingApiModel" placeholder="gpt-4">
                </div>
                <div class="settings-group">
                    <label class="settings-label">Tavily API Key <span class="settings-optional">(Optional)</span></label>
                    <input type="password" class="settings-input" id="settingTavilyKey" placeholder="tvly-...">
                </div>
                <div class="settings-divider"></div>
                <div class="settings-group">
                    <label class="settings-label">Max Steps <span class="settings-optional">(default: 20)</span></label>
                    <input type="number" class="settings-input" id="settingMaxSteps" placeholder="20" min="1" max="50">
                </div>
                <div class="settings-group">
                    <label class="settings-label">Max Tokens <span class="settings-optional">(AI response, default: 30000)</span></label>
                    <input type="number" class="settings-input" id="settingMaxTokens" placeholder="30000" min="1000">
                </div>
                <div class="settings-group">
                    <label class="settings-label">Compress At <span class="settings-optional">(memory compression threshold, default: 25000)</span></label>
                    <input type="number" class="settings-input" id="settingCompressAt" placeholder="25000" min="1000">
                </div>
                <div class="settings-group">
                    <label class="settings-label">Max Web Searches <span class="settings-optional">(default: 3)</span></label>
                    <input type="number" class="settings-input" id="settingMaxWebSearches" placeholder="3" min="0" max="10">
                </div>
            </div>
            <div class="settings-modal-footer">
                <button class="btn-cancel" onclick="closeSettingsModal()">Cancel</button>
                <button class="btn-save" onclick="saveSettings()">Save</button>
            </div>
        </div>
    </div>
    
    <script src="/eel.js"></script>
    <script src="app.js"></script>
</body>
</html>
